[package]
name = "vphone-create-steps"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "On-device iOS VM creation steps for the vphone Android app: no PC, no root"

[lib]
name = "vphone_create_steps"
path = "src/lib.rs"

[dependencies]
# Pinned exactly: the SSH client talks to a 2016 dropbear and the signature
# shape must not change under us.
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.1"
apple-codesign = { version = "=0.29.0", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
vphone-apfs = { path = "../apfs" }
vusb-portfwd = { path = "../vusb/portfwd" }
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.7"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "=0.25.5", default-features = false, features = ["png"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
rand = "0.8"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "rsa", "getrandom", "encryption"] }
