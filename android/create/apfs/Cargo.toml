[package]
name = "vphone-apfs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Userspace APFS reader/writer for the vphone Android app (no mount, no root)"

[lib]
name = "vphone_apfs"
path = "src/lib.rs"

[[bin]]
name = "vphone_apfs"
path = "src/main.rs"

[dependencies]
# Exact versions: the on-disk behaviour of these is part of what was tested.
cmpfs = "=0.1.0"
udif = "=0.4.2"
unicode-normalization = "=0.1.24"
caseless = "=0.2.2"
serde_json = "=1.0.140"
# The write engine: enesilhaydin/apfs-explorer at the commit in
# android/scripts/build-apfs.sh, plus patches/apfs-explorer/ (GPL-3.0-only).
# build-apfs.sh checks it out to android/build/apfs-deps/.
apfs-core = { path = "../../build/apfs-deps/apfs-explorer/crates/apfs-core" }
apfs-write = { path = "../../build/apfs-deps/apfs-explorer/crates/apfs-write" }

[dev-dependencies]
miniz_oxide = "=0.8.9"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 4
panic = "unwind"
