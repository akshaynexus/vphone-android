[package]
name = "vphone-native"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
publish = false

[lib]
name = "vphone_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "0.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = { version = "0.13", features = ["zstdmt"] }
blake3 = "1"
sha2 = "=0.10.9"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
vphone-create-steps = { path = "../create/installer" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = 2
debug = 1
panic = "unwind"

[workspace]
